<style>
:root{--violet:#9B6FDF;--violet-l:#C3A9EC;--panel:#1A1A1A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden;overflow-x:clip}
body{min-height:100vh;min-height:100dvh;background:linear-gradient(180deg,#000 0%,#000 55%,#3E2C59 85%,#9B6FDF 100%);display:flex;justify-content:center;padding:28px 16px 24px;overflow-x:hidden;position:relative}
.bgmark{position:absolute;top:-150px;right:-150px;width:340px;height:auto;opacity:.75;pointer-events:none}
.wrap{width:100%;max-width:420px;position:relative;display:flex;flex-direction:column}
.logo{height:24px;width:auto;display:block;align-self:flex-start;margin-bottom:56px}
.person{display:flex;gap:18px;align-items:flex-end;margin-bottom:32px}
.person img{width:124px;height:124px;object-fit:cover;flex:none;display:block}
h1{font-family:"Fractul","Outfit",Arial,sans-serif;font-weight:600;font-size:30px;line-height:1.05;margin-bottom:10px}
.role{font-size:14px;font-weight:700;color:var(--violet-l)}
.org{font-size:13px;margin-top:3px}
.list{display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:center;gap:14px;padding:0 16px;height:58px;background:var(--panel);color:#fff;text-decoration:none;transition:background .15s}
.row:hover,.row:focus-visible{background:#2A2A2A;outline:none}
.row svg{width:22px;height:22px;flex:none}
.row .li{width:20px;height:20px;margin:0 1px;flex:none;filter:invert(1)}
.row .lbl{font-size:12px;font-weight:700;width:64px;flex:none}
.row .val{font-size:14px;overflow-wrap:anywhere}
.row.save{background:var(--violet);justify-content:center;font-weight:700;font-size:14px;margin-top:8px}
.row.save:hover,.row.save:focus-visible{background:#8A5CD3}
footer{margin-top:auto;padding-top:28px;display:flex;justify-content:center;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:#fff}
footer a{color:#fff;text-decoration:none}
footer a:hover{text-decoration:underline}
</style>
